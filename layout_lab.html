<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3-Column Layout Lab</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>

    <h2>Trường hợp 1: Không dùng border-box </h2>
    <div class="container content-box-mode">
        <aside class="sidebar-left">Sidebar (250px)</aside>
        <main class="content-mid">Content (500px)</main>
        <aside class="sidebar-right">Ads (250px)</aside>
    </div>

    <br><br><hr><br>

    <h2>Trường hợp 2: Có dùng border-box </h2>
    <div class="container border-box-mode">
        <aside class="sidebar-left">Sidebar (250px)</aside>
        <main class="content-mid">Content (500px)</main>
        <aside class="sidebar-right">Ads (250px)</aside>
    </div>

</body>
</html>
